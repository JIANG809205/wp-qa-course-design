# 测试环境加固配置（对应 DEF-002/003/004/010）
# 仅在测试环境加载，用于演示"缺陷—修复—复测"闭环

# DEF-010：隐藏 Server 版本
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    # DEF-004：补齐四项安全响应头
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
</IfModule>

# DEF-010（补充）：直接移除 Server 响应头
<IfModule mod_headers.c>
    Header always unset Server
</IfModule>

# DEF-005：在 Web 层关闭 XML-RPC（应用层过滤器在本版本对匿名 system.* 方法不生效）
<Files "xmlrpc.php">
    Require all denied
</Files>

# DEF-002：调试日志禁止外部访问
<FilesMatch "^debug\.log$">
    Require all denied
</FilesMatch>

# DEF-003：上传目录关闭索引
<Directory /var/www/html/wp-content/uploads>
    Options -Indexes
</Directory>
