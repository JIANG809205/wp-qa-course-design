; WordPress 容器 PHP 上传限制覆盖
; 默认 upload_max_filesize=2M，无法测试 3M 边界值，这里放宽到 16M
; 注意：文件上传超过 16M 仍会被拒绝——这本身是边界值用例的靶点
upload_max_filesize = 16M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; 时区与字符集
date.timezone = Asia/Shanghai
default_charset = "UTF-8"
